name: dcm
description: A flutter player for DCM Content Management System.
publish_to: "none"

version: 0.25.3

environment:
  sdk: ">=3.1.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  path: ^1.8.3
  path_provider: ^2.1.1
  file_picker: ^8.3.1
  mime_type: ^1.0.0
  device_info: ^2.0.2
  permission_handler: ^9.2.0
  intl: ^0.20.2
  open_file: ^3.2.1
  json_annotation: ^4.8.1
  url_launcher: ^6.2.5
  wakelock_plus: ^1.2.11
  window_manager:
    git:
      url: https://github.com/YuiHrsw/window_manager.git
      path: packages/window_manager
      ref: windows_fullscreen_fix

  # Media
  whisper4dart: ^0.1.4
  # libmpv_dart: ^0.0.4

  media_kit:
    git:
      url: https://github.com/Playboy-Player/media_cat.git
      path: media_kit
      ref: 445c94d0a6a8076fef8f424fabcfd53709bb2d5e
  media_kit_video:
    git:
      url: https://github.com/Playboy-Player/media_cat.git
      path: media_kit_video
      ref: 445c94d0a6a8076fef8f424fabcfd53709bb2d5e
  media_kit_libs_video:
    git:
      url: https://github.com/Playboy-Player/media_cat.git
      path: libs/universal/media_kit_libs_video
      ref: 445c94d0a6a8076fef8f424fabcfd53709bb2d5e

  video_player: ^2.8.2
  syncfusion_flutter_pdfviewer: ^33.1.44
  webview_flutter: ^4.2.2
  pointycastle: ^3.7.3
  xml: ^6.3.0
  # print colorful logs
  logger: ^2.7.0
  uuid: ^4.1.0
  isolate_handler: ^1.0.0
  shared_preferences: ^2.0.4
  pair: ^0.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.3.3
  json_serializable: ^6.7.1

flutter:
  assets:
    - l10n/
  uses-material-design: true
  generate: true
